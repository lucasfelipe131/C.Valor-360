openapi: 3.1.0
info:
  title: VAL Core API
  version: 1.0.0
  description: API aditiva da camada de contratos do VAL Core. As rotas legadas permanecem compatíveis.
paths:
  /api/val/status:
    get:
      summary: Informa a saúde da engine e a versão dos contratos do Core
      responses:
        '200':
          description: Estado público da engine
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/val/chat:
    post:
      summary: Executa a recomendação preservando a resposta legada
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        $ref: '#/components/requestBodies/RecommendationInput'
      responses:
        '200':
          description: Payload legado, acrescido do requestId de acompanhamento já existente
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/val/recommendations:
    post:
      summary: Alias legado compatível de recomendação
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        $ref: '#/components/requestBodies/RecommendationInput'
      responses:
        '200':
          description: Payload legado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/val/recommendations:
    post:
      summary: Executa a mesma ValEngine e devolve ResponseEnvelope v1
      description: O servidor deriva organization_id, actor e policy_context da sessão; esses campos não são aceitos do cliente. A recomendação inclui, de forma aditiva, contextSnapshotId/contextSnapshotVersion e os artefatos opcionais behavioral_profile, decision_thesis e value_plan. As APIs legadas e seus campos permanecem compatíveis.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        $ref: '#/components/requestBodies/RecommendationInput'
      responses:
        '200':
          description: Resposta canônica, auditável e versionada
          content:
            application/json:
              schema:
                $ref: '../contracts/v1/response-envelope.schema.json'
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/visits/{visitId}/preparation:
    parameters:
      - name: visitId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/RequestId'
    get:
      summary: Recupera a preparação mais recente da visita no escopo autorizado
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: PrepareVisit v1 e ActionPlan v1 persistidos
          content:
            application/json:
              schema:
                type: object
                required: [contract_version, preparation, action_plan]
                properties:
                  contract_version: {const: val.prepare_visit.response.v1}
                  preparation: {$ref: '../contracts/v1/prepare-visit.schema.json'}
                  action_plan: {$ref: '../contracts/v1/action-plan.schema.json'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      summary: Gera e persiste preparação tenant-safe a partir dos artefatos aprovados
      security: [{sessionCookie: []}]
      responses:
        '201':
          description: Preparação criada sem registrar a visita pós-campo
          content:
            application/json:
              schema:
                type: object
                required: [contract_version, preparation, action_plan]
                properties:
                  contract_version: {const: val.prepare_visit.response.v1}
                  preparation: {$ref: '../contracts/v1/prepare-visit.schema.json'}
                  action_plan: {$ref: '../contracts/v1/action-plan.schema.json'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/visits/{visitId}/report:
    parameters:
      - {name: visitId, in: path, required: true, schema: {type: string, format: uuid}}
      - $ref: '#/components/parameters/RequestId'
    get:
      summary: Recupera o VisitReport mais recente no escopo autorizado
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: VisitReport v1 candidato ou confirmado
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract_version: {const: val.visit_report.response.v1}
                  visit_report: {$ref: '../contracts/v1/visit-report.schema.json'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      summary: Organiza texto ou áudio transcrito como report candidato, sem consolidar fatos
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_type]
              properties:
                source_type: {enum: [TEXT, AUDIO]}
                text: {type: string, maxLength: 20000}
                attachment_id: {type: string, format: uuid}
                idempotency_key: {type: string, maxLength: 180}
      responses:
        '201':
          description: VisitReport v1 em PENDING_REVIEW
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract_version: {const: val.visit_report.response.v1}
                  visit_report: {$ref: '../contracts/v1/visit-report.schema.json'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/visits/{visitId}/confirm:
    post:
      summary: Confirma o report revisado e consolida somente itens aprovados pelo consultor
      security: [{sessionCookie: []}]
      parameters:
        - {name: visitId, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visit_report_id, outcome_type]
              properties:
                visit_report_id: {type: string, format: uuid}
                fields: {type: object}
                remove_item_ids: {type: array, items: {type: string}}
                additions: {type: object}
                confirm_commitment_ids: {type: array, items: {type: string}}
                commitments_confirmed: {type: array, items: {type: object}}
                next_steps: {type: array, items: {type: object}}
                outcome_type: {enum: [WON, LOST, PARTIAL, NO_DECISION, FOLLOW_UP, TECHNICAL_RESULT, RELATIONSHIP_PROGRESS, NO_CHANGE]}
                result: {type: object}
                evidence_refs: {type: array, items: {type: object}}
      responses:
        '200':
          description: Visita confirmada, Commitment/Outcome/LearningCandidate rastreáveis
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract_version: {const: val.visit_confirmation.response.v1}
                  visit_report: {$ref: '../contracts/v1/visit-report.schema.json'}
                  commitments: {type: array, items: {$ref: '../contracts/v1/commitment.schema.json'}}
                  outcome: {$ref: '../contracts/v1/outcome.schema.json'}
                  learning_candidate: {$ref: '../contracts/v1/learning-candidate.schema.json'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/visits/{visitId}/learning-context:
    get:
      summary: Recupera a cadeia autorizada preparação → report → outcome → aprendizado
      security: [{sessionCookie: []}]
      parameters:
        - {name: visitId, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Contexto operacional da visita sem conteúdo de transcript
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/outcomes:
    post:
      summary: Registra Outcome v1 adicional para uma visita autorizada
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visit_id, outcome_type, result]
              properties:
                visit_id: {type: string, format: uuid}
                outcome_type: {enum: [WON, LOST, PARTIAL, NO_DECISION, FOLLOW_UP, TECHNICAL_RESULT, RELATIONSHIP_PROGRESS, NO_CHANGE]}
                result: {type: object}
                evidence_refs: {type: array, items: {type: object}}
                measured_at: {type: string, format: date-time}
                confidence: {type: number, minimum: 0, maximum: 1}
                notes: {type: string, maxLength: 4000}
      responses:
        '201':
          description: Outcome v1 persistido
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract_version: {const: val.outcome.response.v1}
                  outcome: {$ref: '../contracts/v1/outcome.schema.json'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/action-plans:
    post:
      summary: Persiste ActionPlan v1 já validado e seu vínculo rastreável
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      responses:
        '201':
          description: ActionPlan persistido
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract_version: {const: val.action_plan.response.v1}
                  action_plan: {$ref: '../contracts/v1/action-plan.schema.json'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/commitments:
    get:
      summary: Lista compromissos da carteira autorizada
      security: [{sessionCookie: []}]
      parameters:
        - {name: clientId, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Coleção de Commitment v1
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract_version: {const: val.commitment.collection.v1}
                  commitments: {type: array, items: {$ref: '../contracts/v1/commitment.schema.json'}}
    post:
      summary: Cria compromisso somente com owner, prazo e critério
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      responses:
        '201':
          description: Commitment v1 criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract_version: {const: val.commitment.response.v1}
                  commitment: {$ref: '../contracts/v1/commitment.schema.json'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/commitments/{commitmentId}:
    patch:
      summary: Transiciona compromisso; DONE exige evidência
      security: [{sessionCookie: []}]
      parameters:
        - {name: commitmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Commitment v1 atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract_version: {const: val.commitment.response.v1}
                  commitment: {$ref: '../contracts/v1/commitment.schema.json'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/insights:
    get:
      summary: Responde o que merece atenção agora no escopo autorizado
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Feed com no máximo cinco InsightCard v1 não expirados
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract_version: {const: val.insight_feed.v1}
                  items: {type: array, maxItems: 5, items: {$ref: '../contracts/v1/insight-card.schema.json'}}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: valor360_session
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: UUID aceito como correlation_id; valores inválidos são substituídos pelo servidor.
  requestBodies:
    RecommendationInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [clientId]
            properties:
              clientId: {type: string, minLength: 1, maxLength: 180}
              client: {type: object, additionalProperties: true}
              message: {type: string, maxLength: 3000}
              question: {type: string, maxLength: 3000}
              attachmentIds:
                type: array
                maxItems: 3
                items: {type: string, format: uuid}
              mode: {type: string, maxLength: 240}
              requestedStage: {type: string, maxLength: 240}
              requestId: {type: string, format: uuid}
  responses:
    Error:
      description: Falha validada sem exposição de contexto interno
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error: {type: string}
  schemas:
    RequestEnvelope:
      $ref: '../contracts/v1/request-envelope.schema.json'
    ResponseEnvelope:
      $ref: '../contracts/v1/response-envelope.schema.json'
    MemoryRecord:
      $ref: '../contracts/v1/memory-record.schema.json'
    ContextSnapshot:
      $ref: '../contracts/v1/context-snapshot.schema.json'
    BehavioralProfile:
      $ref: '../contracts/v1/behavioral-profile.schema.json'
    QuestionnaireDefinition:
      $ref: '../contracts/v1/questionnaire-definition.schema.json'
    DecisionThesis:
      $ref: '../contracts/v1/decision-thesis.schema.json'
    ValuePlan:
      $ref: '../contracts/v1/value-plan.schema.json'
    ActionPlan:
      $ref: '../contracts/v1/action-plan.schema.json'
    Commitment:
      $ref: '../contracts/v1/commitment.schema.json'
    InsightCard:
      $ref: '../contracts/v1/insight-card.schema.json'
    PrepareVisit:
      $ref: '../contracts/v1/prepare-visit.schema.json'
    VisitLifecycle:
      $ref: '../contracts/v1/visit-lifecycle.schema.json'
    VisitTranscript:
      $ref: '../contracts/v1/visit-transcript.schema.json'
    VisitReport:
      $ref: '../contracts/v1/visit-report.schema.json'
    Outcome:
      $ref: '../contracts/v1/outcome.schema.json'
    LearningCandidate:
      $ref: '../contracts/v1/learning-candidate.schema.json'
