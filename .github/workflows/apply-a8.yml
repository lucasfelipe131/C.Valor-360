name: Apply A8 learning loop docs

on:
  push:
    branches: [a8-learning-loop-docs]
    paths:
      - scripts/apply-a8.py
      - .github/workflows/apply-a8.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8-learning-loop-docs
          fetch-depth: 0
      - name: Aplicar documentação
        run: python3 scripts/apply-a8.py
      - name: Registrar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "A8 — documenta o loop de aprendizado offline"
          git push origin HEAD:a8-learning-loop-docs
