name: Find A4 legacy gate

on:
  push:
    branches: [a4-methodology-source]
    paths:
      - scripts/find-a4-failure.sh
      - .github/workflows/find-a4-failure.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a4-methodology-source
      - run: bash scripts/find-a4-failure.sh
