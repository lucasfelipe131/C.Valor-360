name: Apply C3 terminology audit

on:
  push:
    branches: [c3-terminology-audit]
    paths:
      - scripts/apply-c3.py
      - .github/workflows/apply-c3.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3-terminology-audit
          fetch-depth: 0
      - name: Aplicar relatório
        run: python3 scripts/apply-c3.py
      - name: Registrar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "C3 — registra auditoria de terminologia sem renomear contratos"
          git push origin HEAD:c3-terminology-audit
