name: Apply C2 accent guard docs

on:
  push:
    branches: [c2-accent-pattern-guard]
    paths:
      - scripts/apply-c2.py
      - .github/workflows/apply-c2.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2-accent-pattern-guard
          fetch-depth: 0
      - name: Aplicar documentação
        run: python3 scripts/apply-c2.py
      - name: Registrar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "C2 — documenta regex e normalizadores intencionais de acento"
          git push origin HEAD:c2-accent-pattern-guard
