name: Audit C1 copy

on:
  push:
    branches: [c1-ptbr-copy-review]
    paths:
      - scripts/audit-c1.py
      - .github/workflows/audit-c1.yml

permissions:
  contents: write

jobs:
  audit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1-ptbr-copy-review
          fetch-depth: 0
      - name: Gerar relatório
        run: python3 scripts/audit-c1.py
      - name: Registrar relatório temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/c1-copy-audit.txt
          git commit -m "chore: gera auditoria temporária de copy"
          git push origin HEAD:c1-ptbr-copy-review
