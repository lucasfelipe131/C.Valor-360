name: Apply A3 context relevance

on:
  push:
    branches: [a3-context-relevance-ranking]
    paths:
      - scripts/apply-a3.py
      - .github/workflows/apply-a3.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3-context-relevance-ranking
          fetch-depth: 0
      - name: Aplicar compactação orientada ao assunto
        run: python3 scripts/apply-a3.py
      - name: Registrar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "A3 — prioriza contexto por relevância e recência"
          git push origin HEAD:a3-context-relevance-ranking
