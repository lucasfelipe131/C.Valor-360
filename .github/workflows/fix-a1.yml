name: Fix A1 human review wording

on:
  push:
    branches: [a1-tiered-cacheable-instructions]
    paths:
      - scripts/fix-a1.py
      - .github/workflows/fix-a1.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a1-tiered-cacheable-instructions
          fetch-depth: 0
      - name: Aplicar correção
        run: python3 scripts/fix-a1.py
      - name: Registrar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "A1 — reforça revisão humana no prefixo fixo"
          git push origin HEAD:a1-tiered-cacheable-instructions
