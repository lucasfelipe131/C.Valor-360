name: Apply A6 configurable retries

on:
  push:
    branches: [a6-configurable-openai-retries]
    paths:
      - scripts/apply-a6.py
      - .github/workflows/apply-a6.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a6-configurable-openai-retries
          fetch-depth: 0
      - name: Aplicar retries configuráveis
        run: python3 scripts/apply-a6.py
      - name: Registrar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "A6 — respeita retries configuráveis da OpenAI"
          git push origin HEAD:a6-configurable-openai-retries
