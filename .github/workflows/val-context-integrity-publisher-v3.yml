name: Publish and verify VAL Context Integrity Handoff

on:
  push:
    branches:
      - bootstrap/val-context-integrity-loader-v1
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: write

env:
  TARGET_BRANCH: fix/val-context-integrity-grounding-v1
  PR_BRANCH: pr/val-context-integrity-grounding-v1
  BASE_BRANCH: feature/val-conversational-os-vnext
  BASE_SHA: 5aee2cf0d2bac615ed4f6ec39791980f5cb4f487
  EXPECTED_HEAD: cff63e9ad61517108d8337a6fc7ca3ed1533b838
  EXPECTED_TREE: ae992f8b942581af32d607be3fb92cdae0cfded2
  PAYLOAD_SHA256: 0a0ef77d7f857737fd53f4ad7ee81f3e6045cd3488500ccfe779f69e1d7e79e4
  PAYLOAD_URL: https://filebin.net/val-context-0a0ef77d-20260831/context.patch.xz

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Publish exact handoff if required
        working-directory: target
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          if [ "$current" != "$EXPECTED_HEAD" ]; then
            test "$current" = "$BASE_SHA"
            curl --fail --show-error --silent --location \
              --retry 5 --retry-all-errors --connect-timeout 20 --max-time 240 \
              "$PAYLOAD_URL" -o /tmp/context.patch.xz
            echo "${PAYLOAD_SHA256}  /tmp/context.patch.xz" | sha256sum -c -
            xz -dc /tmp/context.patch.xz > /tmp/context.patch
            git config user.name Codex
            git config user.email codex@openai.com
            GIT_COMMITTER_NAME=Codex GIT_COMMITTER_EMAIL=codex@openai.com \
              git am --committer-date-is-author-date /tmp/context.patch
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
            test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
            git push origin HEAD:refs/heads/$TARGET_BRANCH
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"

      - name: Create or synchronize exact PR branch
        working-directory: target
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" "$BASE_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          git push origin "$EXPECTED_HEAD:refs/heads/$PR_BRANCH" --force-with-lease || \
            git push origin "$EXPECTED_HEAD:refs/heads/$PR_BRANCH"

      - name: Create or verify DRAFT PR
        id: pr
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number="$(gh pr list --state open --head "$PR_BRANCH" --base "$BASE_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            url="$(gh pr create --draft --head "$PR_BRANCH" --base "$BASE_BRANCH" \
              --title "fix(val): enforce context integrity and grounded follow-ups" \
              --body "Publicação controlada do handoff VAL Context Integrity + Grounding + Fast Follow-up Recovery v1. HEAD exato: $EXPECTED_HEAD. Tree exata: $EXPECTED_TREE. Sem merge em main, sem produção e sem deploy automático. O gate permanece pendente de staging exato, Context Trace do caso Matheus e PROFILE p95 abaixo de 2 s.")"
            number="$(gh pr view "$url" --json number --jq .number)"
          fi
          test "$(gh pr view "$number" --json headRefOid --jq .headRefOid)" = "$EXPECTED_HEAD"
          test "$(gh pr view "$number" --json baseRefName --jq .baseRefName)" = "$BASE_BRANCH"
          test "$(gh pr view "$number" --json isDraft --jq .isDraft)" = "true"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "url=$(gh pr view "$number" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Wait for remote PR checks
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            checks="$(gh pr checks "$PR_NUMBER" --json name,state,workflow 2>/dev/null || true)"
            count="$(jq 'length' <<<"$checks" 2>/dev/null || echo 0)"
            pending="$(jq '[.[] | select(.state == "QUEUED" or .state == "IN_PROGRESS" or .state == "PENDING" or .state == "WAITING")] | length' <<<"$checks" 2>/dev/null || echo 0)"
            failed="$(jq '[.[] | select(.state == "FAILURE" or .state == "ERROR" or .state == "CANCELLED" or .state == "TIMED_OUT" or .state == "ACTION_REQUIRED")] | length' <<<"$checks" 2>/dev/null || echo 0)"
            echo "attempt=$attempt count=$count pending=$pending failed=$failed"
            if [ "$failed" -gt 0 ]; then
              gh pr checks "$PR_NUMBER" || true
              exit 1
            fi
            if [ "$count" -gt 0 ] && [ "$pending" -eq 0 ]; then
              gh pr checks "$PR_NUMBER"
              exit 0
            fi
            sleep 15
          done
          echo "Remote checks did not finish within the controlled window."
          exit 1

      - name: Mark publication verification success
        if: success()
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_HEAD}" \
            -f state=success \
            -f context='VAL Context Integrity Publication' \
            -f description='Exact branch, tree, DRAFT PR and remote checks verified' \
            -f target_url='${{ steps.pr.outputs.url }}'
          {
            echo '## VAL Context Integrity publication — PASS'
            echo "- Branch: $TARGET_BRANCH"
            echo "- HEAD: $EXPECTED_HEAD"
            echo "- TREE: $EXPECTED_TREE"
            echo "- DRAFT PR: #${{ steps.pr.outputs.number }}"
            echo "- URL: ${{ steps.pr.outputs.url }}"
            echo '- main: unchanged'
            echo '- production: unchanged'
            echo '- staging: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark publication verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_HEAD}" \
            -f state=failure \
            -f context='VAL Context Integrity Publication' \
            -f description='Publication or remote check verification failed' || true
