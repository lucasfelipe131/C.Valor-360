name: Audit C3 terminology

on:
  push:
    branches: [c3-terminology-audit]
    paths:
      - scripts/audit-c3.py
      - .github/workflows/audit-c3.yml

permissions:
  contents: write

jobs:
  audit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3-terminology-audit
          fetch-depth: 0
      - name: Gerar inventário
        run: python3 scripts/audit-c3.py
      - name: Registrar inventário temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/c3-terms.md
          git commit -m "chore: gera inventário temporário de terminologia"
          git push origin HEAD:c3-terminology-audit
