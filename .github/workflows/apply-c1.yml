name: Apply C1 PT-BR copy review

on:
  push:
    branches: [c1-ptbr-copy-review]
    paths:
      - scripts/apply-c1.py
      - .github/workflows/apply-c1.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1-ptbr-copy-review
          fetch-depth: 0
      - name: Aplicar revisão
        run: python3 scripts/apply-c1.py
      - name: Registrar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "C1 — revisa ortografia, gramática e pontuação dos textos humanos"
          git push origin HEAD:c1-ptbr-copy-review
