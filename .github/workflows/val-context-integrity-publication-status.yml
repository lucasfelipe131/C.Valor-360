name: Finalize VAL Context Integrity Publication Status

on:
  push:
    branches:
      - bootstrap/val-context-integrity-loader-v1
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: write

env:
  TARGET_BRANCH: fix/val-context-integrity-grounding-v1
  PR_BRANCH: pr/val-context-integrity-grounding-v1
  BASE_BRANCH: feature/val-conversational-os-vnext
  BASE_SHA: 5aee2cf0d2bac615ed4f6ec39791980f5cb4f487
  EXPECTED_HEAD: cff63e9ad61517108d8337a6fc7ca3ed1533b838
  EXPECTED_TREE: ae992f8b942581af32d607be3fb92cdae0cfded2
  PAYLOAD_SHA256: 0a0ef77d7f857737fd53f4ad7ee81f3e6045cd3488500ccfe779f69e1d7e79e4
  PAYLOAD_URL: https://filebin.net/val-context-0a0ef77d-20260831/context.patch.xz

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', 'record publication status') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Publish exact handoff when required
        id: publish
        working-directory: target
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          if [ "$current" != "$EXPECTED_HEAD" ]; then
            test "$current" = "$BASE_SHA"
            curl --fail --show-error --silent --location --retry 5 --retry-all-errors \
              --connect-timeout 20 --max-time 240 "$PAYLOAD_URL" -o /tmp/context.patch.xz
            echo "${PAYLOAD_SHA256}  /tmp/context.patch.xz" | sha256sum -c -
            xz -dc /tmp/context.patch.xz > /tmp/context.patch
            git config user.name Codex
            git config user.email codex@openai.com
            GIT_COMMITTER_NAME=Codex GIT_COMMITTER_EMAIL=codex@openai.com \
              git am --committer-date-is-author-date /tmp/context.patch
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
            test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
            git push origin HEAD:refs/heads/$TARGET_BRANCH
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"

      - name: Create exact PR branch and DRAFT PR
        id: pr
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" "$BASE_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          remote_pr_sha="$(git ls-remote origin refs/heads/$PR_BRANCH | awk '{print $1}')"
          if [ -z "$remote_pr_sha" ]; then
            git push origin "$EXPECTED_HEAD:refs/heads/$PR_BRANCH"
          else
            test "$remote_pr_sha" = "$EXPECTED_HEAD"
          fi
          number="$(gh pr list --state open --head "$PR_BRANCH" --base "$BASE_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            url="$(gh pr create --draft --head "$PR_BRANCH" --base "$BASE_BRANCH" \
              --title "fix(val): enforce context integrity and grounded follow-ups" \
              --body "Publicação controlada do handoff VAL Context Integrity + Grounding + Fast Follow-up Recovery v1. HEAD exato: $EXPECTED_HEAD. Tree exata: $EXPECTED_TREE. Sem merge em main, sem produção e sem deploy automático. O gate permanece pendente de staging exato, Context Trace do caso Matheus e PROFILE p95 abaixo de 2 s.")"
            number="$(gh pr view "$url" --json number --jq .number)"
          fi
          test "$(gh pr view "$number" --json headRefOid --jq .headRefOid)" = "$EXPECTED_HEAD"
          test "$(gh pr view "$number" --json baseRefName --jq .baseRefName)" = "$BASE_BRANCH"
          test "$(gh pr view "$number" --json isDraft --jq .isDraft)" = "true"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "url=$(gh pr view "$number" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Wait for PR checks and build status document
        id: verify
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          verdict=PENDING
          checks_json='[]'
          for attempt in $(seq 1 100); do
            checks_json="$(gh pr checks "$PR_NUMBER" --json name,state,workflow,link 2>/dev/null || echo '[]')"
            count="$(jq 'length' <<<"$checks_json")"
            pending="$(jq '[.[] | select(.state == "QUEUED" or .state == "IN_PROGRESS" or .state == "PENDING" or .state == "WAITING")] | length' <<<"$checks_json")"
            failed="$(jq '[.[] | select(.state == "FAILURE" or .state == "ERROR" or .state == "CANCELLED" or .state == "TIMED_OUT" or .state == "ACTION_REQUIRED")] | length' <<<"$checks_json")"
            if [ "$failed" -gt 0 ]; then verdict=FAIL; break; fi
            if [ "$count" -gt 0 ] && [ "$pending" -eq 0 ]; then verdict=PASS; break; fi
            sleep 15
          done
          target_sha="$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')"
          pr_sha="$(git ls-remote origin refs/heads/$PR_BRANCH | awk '{print $1}')"
          test "$target_sha" = "$EXPECTED_HEAD"
          test "$pr_sha" = "$EXPECTED_HEAD"
          {
            echo '# VAL — Context Integrity Publication Status'
            echo
            echo "**VERDICT: $verdict**"
            echo
            echo "- Target branch: \`$TARGET_BRANCH\`"
            echo "- HEAD: \`$target_sha\`"
            echo "- TREE: \`$EXPECTED_TREE\`"
            echo "- DRAFT PR: #$PR_NUMBER"
            echo "- PR URL: ${{ steps.pr.outputs.url }}"
            echo "- PR base: \`$BASE_BRANCH\`"
            echo "- CI: **$verdict**"
            echo '- main: unchanged'
            echo '- production: unchanged'
            echo '- staging: unchanged'
            echo '- merge: not executed'
            echo
            echo '## Checks'
            echo '```json'
            jq . <<<"$checks_json"
            echo '```'
            echo
            echo '## Remaining gate work'
            echo '- exact staging deployment after CI PASS'
            echo '- /live, /health and /ready'
            echo '- authenticated Matheus replay with Context Trace'
            echo '- PROFILE p95 below 2 seconds'
          } > /tmp/VAL_CONTEXT_INTEGRITY_PUBLICATION_STATUS.md
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = FAIL ]; then exit 1; fi
          if [ "$verdict" = PENDING ]; then exit 1; fi

      - name: Commit fixed-path status document
        if: always() && steps.pr.outputs.number != ''
        uses: actions/checkout@v4
        with:
          ref: bootstrap/val-context-integrity-loader-v1
          path: status
          fetch-depth: 0
          persist-credentials: true

      - name: Push fixed-path status document
        if: always() && steps.pr.outputs.number != ''
        working-directory: status
        run: |
          set -euo pipefail
          mkdir -p publication-status
          if [ -f /tmp/VAL_CONTEXT_INTEGRITY_PUBLICATION_STATUS.md ]; then
            cp /tmp/VAL_CONTEXT_INTEGRITY_PUBLICATION_STATUS.md publication-status/VAL_CONTEXT_INTEGRITY_PUBLICATION_STATUS.md
          else
            cat > publication-status/VAL_CONTEXT_INTEGRITY_PUBLICATION_STATUS.md <<EOF
          # VAL — Context Integrity Publication Status

          **VERDICT: FAIL**

          The controlled publisher stopped before completing the exact branch/PR/check verification.
          - main: unchanged
          - production: unchanged
          - staging: unchanged
          EOF
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add publication-status/VAL_CONTEXT_INTEGRITY_PUBLICATION_STATUS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(val): record publication status [skip ci]'
          git push origin HEAD:refs/heads/bootstrap/val-context-integrity-loader-v1

      - name: Publish status on exact commit
        if: always() && steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure
          description='Publication or CI verification failed'
          if [ '${{ steps.verify.outputs.verdict }}' = PASS ]; then
            state=success
            description='Exact branch, tree, DRAFT PR and CI verified'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_HEAD}" \
            -f state="$state" \
            -f context='VAL Context Integrity Publication' \
            -f description="$description" \
            -f target_url='${{ steps.pr.outputs.url }}' || true
