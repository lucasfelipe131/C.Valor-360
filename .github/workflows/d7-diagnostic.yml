name: D7 Diagnostic
on:
  push:
    branches: [d7-message-calibration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d7:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capturar falha da suíte completa
        shell: bash
        run: |
          set +e
          node --test >/tmp/full-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '===== RESUMO DAS FALHAS ====='
            grep -n -E 'not ok|AssertionError|ERR_ASSERTION|failureType|expected:|actual:|operator:' -A18 -B6 /tmp/full-test.log || tail -n 180 /tmp/full-test.log
          else
            tail -n 20 /tmp/full-test.log
          fi
          exit "$status"
