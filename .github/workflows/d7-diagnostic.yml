name: D7 Diagnostic
on:
  push:
    branches: [d7-message-calibration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d7:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Localizar testes regressivos
        shell: bash
        run: |
          set +e
          failures=0
          for file in test/*.test.js; do
            if ! node --test "$file" >/tmp/test-output.log 2>&1; then
              echo "===== FALHOU: $file ====="
              cat /tmp/test-output.log
              failures=$((failures+1))
            fi
          done
          echo "Arquivos de teste com falha: $failures"
          exit "$failures"
