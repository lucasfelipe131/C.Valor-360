name: D7 Diagnostic
on:
  push:
    branches: [d7-message-calibration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d7:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes isolados D7
        run: node --test test/message-calibration.test.js test/conversion-bootstrap-contract.test.js test/learning-loop-docs.test.js
