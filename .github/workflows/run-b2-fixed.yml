name: Run fixed B2 patch

on:
  push:
    branches: [b2-strategic-progress]
    paths:
      - scripts/run-b2-fixed.sh
      - .github/workflows/run-b2-fixed.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b2-strategic-progress
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar mudanças corrigidas
        run: bash scripts/run-b2-fixed.sh
      - name: Registrar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "B2 — adiciona progresso real às análises estratégicas"
          git push origin HEAD:b2-strategic-progress
