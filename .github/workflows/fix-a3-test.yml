name: Fix A3 legacy opportunity test

on:
  push:
    branches: [a3-context-relevance-ranking]
    paths:
      - scripts/fix-a3-test.py
      - .github/workflows/fix-a3-test.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3-context-relevance-ranking
          fetch-depth: 0
      - name: Ajustar teste
        run: python3 scripts/fix-a3-test.py
      - name: Registrar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "A3 — ajusta teste legado à ordenação por relevância"
          git push origin HEAD:a3-context-relevance-ranking
